# Meet API Configuration
#######################################################################################################

# Base URL of the Meet external API
meet.server.url=https://meet.example.com/external-api/v1.0

# OAuth2 client credentials
meet.server.clientId=your-client-id
meet.server.clientSecret=your-client-secret

# Email address of the user to delegate
meet.server.scope=app@example.com

# URL pattern for the Meet web frontend ({slug} is replaced with the room slug)
meet.server.meetingUrlPattern=https://meet.example.com/{slug}
